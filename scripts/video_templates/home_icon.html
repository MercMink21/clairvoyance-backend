<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1080px; overflow:hidden; }
  .stage {
    width:1080px; height:1080px; position:relative;
    background:transparent;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding-bottom:140px;
  }
  .logo {
    font-family:'Orbitron',sans-serif; font-weight:900; font-size:82px; letter-spacing:4px;
    color:#f000ff; text-shadow:0 0 14px #f000ff,0 0 34px rgba(240,0,255,.75),0 0 70px rgba(240,0,255,.35);
    text-align:center; white-space:nowrap;
  }
  .sub {
    font-family:'Orbitron',sans-serif; font-weight:700; font-size:26px; letter-spacing:3.5px;
    color:#00f0ff; text-shadow:0 0 10px #00f0ff,0 0 26px rgba(0,240,255,.6);
    margin-top:20px; text-align:center;
  }
  .rule {
    width:380px; height:1px; background:rgba(0,240,255,.35); margin-top:22px;
  }
  .url {
    font-family:'Share Tech Mono',monospace; font-size:26px; color:#00f0ff;
    text-shadow:0 0 8px rgba(0,240,255,.5); margin-top:22px; letter-spacing:.5px;
  }
</style>
</head>
<body>
  <canvas id="bgCanvas" width="1080" height="1080" style="position:absolute;top:0;left:0;z-index:-1"></canvas>
  <script>
    (function(){
      var cv=document.getElementById('bgCanvas');
      var ctx=cv.getContext('2d');
      var W=1080,H=1080,cx=W/2,cy=H/2;
      ctx.fillStyle='#222233';ctx.fillRect(0,0,W,H);
      var DS=Math.max(8,Math.round(W/64));
      ctx.save();
      ctx.strokeStyle='rgba(78,166,176,.5)';ctx.lineWidth=1;
      for(var i=-H;i<=W+H;i+=DS){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i+H,H);ctx.stroke();}
      for(var i=-H;i<=W+H;i+=DS){ctx.beginPath();ctx.moveTo(i,H);ctx.lineTo(i+H,0);ctx.stroke();}
      ctx.restore();
      var vg=ctx.createRadialGradient(cx,cy,W*.30,cx,cy,W*.72);
      vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.22)');
      ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
    })();
  </script>
  <div class="stage">
    <div class="logo">CLAIRVOYANCE</div>
    <div class="sub">ADVANCED SPORTS INTELLIGENCE ENGINE</div>
    <div class="rule"></div>
    <div class="url">clairvoyanceengine.info</div>
  </div>
</body>
</html>
