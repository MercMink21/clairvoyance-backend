<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1350px; overflow:hidden; }
  .stage {
    width:1080px; height:1350px; position:relative;
    background:transparent;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .logo-wrap { position:relative; width:900px; height:100px; }
  .logo, .logo-r, .logo-c {
    font-family:'Orbitron',sans-serif; font-weight:900; font-size:88px; letter-spacing:8px;
    position:absolute; top:0; left:50%; transform:translateX(-50%); white-space:nowrap;
  }
  .logo { color:#f000ff; text-shadow:0 0 13px #f000ff,0 0 28px rgba(240,0,255,.55); opacity:0; animation: settle .01s linear 1.5s forwards; }
  .logo-r { color:#ff2090; opacity:.8; animation: glitchR 1.2s steps(2) forwards, hide .01s linear 1.5s forwards; }
  .logo-c { color:#00f0ff; opacity:.8; animation: glitchC 1.2s steps(2) forwards, hide .01s linear 1.5s forwards; }
  .sub {
    font-family:'Orbitron',sans-serif; font-weight:700; font-size:24px; letter-spacing:5px;
    color:#00f0ff; text-shadow:0 0 12px #00f0ff; margin-top:14px; opacity:0;
    animation: reveal .01s linear 2.4s forwards;
  }
  .headline {
    font-family:'Share Tech Mono',monospace; font-size:27px; letter-spacing:2px;
    color:#f000ff; text-shadow:0 0 8px rgba(240,0,255,.45);
    margin-top:50px; opacity:0; animation: reveal .01s linear 2.2s forwards;
  }
  .headline::before { content:'> '; color:#00da88; }
  .sport-tag {
    font-family:'Share Tech Mono',monospace; font-size:19px; letter-spacing:4px;
    color:#ffcc00; text-shadow:0 0 8px rgba(255,204,0,.5);
    text-align:center; margin-top:14px; opacity:0;
    animation: reveal .01s linear 2.4s forwards;
  }
  .matchup {
    font-family:'Orbitron',sans-serif; font-weight:600; font-size:28px; letter-spacing:1px;
    color:#e6eaff; text-align:center; margin-top:18px; padding:0 60px;
    opacity:0; animation: reveal .01s linear 2.6s forwards;
  }
  .pick {
    font-family:'Orbitron',sans-serif; font-weight:900; font-size:56px; letter-spacing:1px;
    color:#00f0ff; text-align:center; margin-top:20px; padding:0 50px;
    display:inline-block; opacity:0;
    animation: pickGlitch .4s steps(4) 3.0s forwards, statIn .01s linear 3.0s forwards;
  }
  .grade-wrap { margin-top:40px; text-align:center; opacity:0;
    animation: statGlitch .4s steps(4) 3.6s forwards, statIn .01s linear 3.6s forwards;
  }
  .grade-val {
    font-family:'Orbitron',sans-serif; font-weight:900; font-size:44px; letter-spacing:4px;
    display:inline-block;
  }
  .grade-lbl {
    font-family:'Share Tech Mono',monospace; font-size:18px; letter-spacing:3px; color:#f000ff;
    text-shadow:0 0 8px rgba(240,0,255,.5); margin-top:8px;
  }
  .grade-premium { color:#ffcc00; text-shadow:0 0 16px rgba(255,204,0,.6); }
  .grade-optimal { color:#00f0ff; text-shadow:0 0 16px rgba(0,240,255,.6); }
  .grade-lean { color:#f000ff; text-shadow:0 0 16px rgba(240,0,255,.6); }
  .free-badge {
    font-family:'Orbitron',sans-serif; font-weight:700; font-size:22px; letter-spacing:4px;
    color:#222233; background:#00da88; box-shadow:0 0 18px rgba(0,218,136,.6);
    padding:10px 26px; border-radius:3px; margin-top:44px;
    opacity:0; animation: reveal .01s linear 4.2s forwards;
  }
  .footer {
    position:absolute; bottom:70px; left:0; right:0; text-align:center;
    font-family:'Share Tech Mono',monospace; font-size:19px; letter-spacing:0.5px; color:#f000ff; text-shadow:0 0 8px rgba(240,0,255,.5); white-space:nowrap;
    opacity:0; animation: reveal .01s linear 4.7s forwards;
  }
  .disclaimer {
    position:absolute; bottom:40px; left:0; right:0; text-align:center;
    font-family:'Orbitron',sans-serif; font-size:13px; letter-spacing:0.5px;
    color:#f000ff; text-shadow:0 0 8px #f000ff,0 0 16px rgba(240,0,255,.6);
    opacity:0; animation: reveal .01s linear 4.9s forwards;
  }
  @keyframes glitchR { 0%{transform:translate(calc(-50% - 6px),-4px)} 25%{transform:translate(calc(-50% + 5px),3px)} 50%{transform:translate(calc(-50% - 3px),-2px)} 75%{transform:translate(calc(-50% + 6px),4px)} 100%{transform:translate(calc(-50% - 6px),-4px)} }
  @keyframes glitchC { 0%{transform:translate(calc(-50% + 6px),3px)} 25%{transform:translate(calc(-50% - 5px),-4px)} 50%{transform:translate(calc(-50% + 3px),2px)} 75%{transform:translate(calc(-50% - 6px),-3px)} 100%{transform:translate(calc(-50% + 6px),3px)} }
  @keyframes hide { to { opacity:0; } }
  @keyframes settle { to { opacity:1; } }
  @keyframes reveal { to { opacity:1; } }
  @keyframes statIn { to { opacity:1; } }
  @keyframes pickGlitch {
    0%   { filter:hue-rotate(0deg) saturate(1); transform:translate(0,0); text-shadow:0 0 16px #00f0ff,0 0 34px rgba(0,240,255,.6); }
    20%  { filter:hue-rotate(110deg) saturate(4) brightness(1.3); transform:translate(4px,-3px); }
    40%  { filter:hue-rotate(-110deg) saturate(4) brightness(1.3); transform:translate(-4px,3px); }
    60%  { filter:hue-rotate(70deg) saturate(3); transform:translate(3px,2px); }
    80%  { filter:hue-rotate(-70deg) saturate(3); transform:translate(-3px,-2px); }
    100% { filter:hue-rotate(0deg) saturate(1); transform:translate(0,0); text-shadow:0 0 16px #00f0ff,0 0 34px rgba(0,240,255,.6); }
  }
  @keyframes statGlitch {
    0%   { filter:hue-rotate(0deg) saturate(1); transform:translate(0,0); }
    20%  { filter:hue-rotate(110deg) saturate(4) brightness(1.3); transform:translate(4px,-3px); }
    40%  { filter:hue-rotate(-110deg) saturate(4) brightness(1.3); transform:translate(-4px,3px); }
    60%  { filter:hue-rotate(70deg) saturate(3); transform:translate(3px,2px); }
    80%  { filter:hue-rotate(-70deg) saturate(3); transform:translate(-3px,-2px); }
    100% { filter:hue-rotate(0deg) saturate(1); transform:translate(0,0); }
  }
</style>
</head>
<body>
  <canvas id="bgCanvas" width="1080" height="1350" style="position:absolute;top:0;left:0;z-index:-1"></canvas>
  <script>
    // Exact same background algorithm as _cfBg() in docs/app.html (the
    // real card generator) — pixel-matched to StandardLogo.png.
    (function(){
      var cv=document.getElementById('bgCanvas');
      var ctx=cv.getContext('2d');
      var W=1080,H=1350,cx=W/2,cy=H/2;
      ctx.fillStyle='#222233';ctx.fillRect(0,0,W,H);
      var DS=Math.max(8,Math.round(W/64));
      ctx.save();
      ctx.strokeStyle='rgba(78,166,176,.5)';ctx.lineWidth=1;
      for(var i=-H;i<=W+H;i+=DS){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i+H,H);ctx.stroke();}
      for(var i=-H;i<=W+H;i+=DS){ctx.beginPath();ctx.moveTo(i,H);ctx.lineTo(i+H,0);ctx.stroke();}
      ctx.restore();
      var vg=ctx.createRadialGradient(cx,cy,W*.30,cx,cy,W*.72);
      vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.22)');
      ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
    })();
  </script>
  <div class="stage">
    <div class="logo-wrap">
      <div class="logo-r">CLAIRVOYANCE</div>
      <div class="logo-c">CLAIRVOYANCE</div>
      <div class="logo">CLAIRVOYANCE</div>
    </div>
    <div class="sub">ADVANCED SPORTS INTELLIGENCE ENGINE</div>
    <div class="headline" id="headline">FREE PICK OF THE DAY</div>
    <div class="sport-tag" id="sport-tag">// NBA</div>
    <div class="matchup" id="matchup">AWAY @ HOME</div>
    <div class="pick" id="pick">HOME ML</div>
    <div class="grade-wrap">
      <div class="grade-val grade-premium" id="v-grade">PREMIUM</div>
      <div class="grade-lbl">ENGINE GRADE</div>
    </div>
    <div class="free-badge">FREE PICK</div>
    <div class="footer">clairvoyanceengine.info &nbsp;·&nbsp; X @clairvoyanceeng &nbsp;·&nbsp; IG @clairvoyanceengine</div>
    <div class="disclaimer">Model outputs are probabilistic projections, not financial advice</div>
  </div>
</body>
</html>
