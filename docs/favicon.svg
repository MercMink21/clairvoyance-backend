<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8eaff"/>
      <stop offset="45%" stop-color="#f000ff"/>
      <stop offset="100%" stop-color="#f000ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="34" fill="#0a0014"/>
  <!-- cyan reticle -->
  <line x1="14" y1="100" x2="52" y2="100" stroke="#00f0ff" stroke-width="7" stroke-linecap="round"/>
  <line x1="148" y1="100" x2="186" y2="100" stroke="#00f0ff" stroke-width="7" stroke-linecap="round"/>
  <line x1="100" y1="14" x2="100" y2="52" stroke="#00f0ff" stroke-width="7" stroke-linecap="round"/>
  <line x1="100" y1="148" x2="100" y2="186" stroke="#00f0ff" stroke-width="7" stroke-linecap="round"/>
  <!-- magenta ring -->
  <circle cx="100" cy="100" r="46" fill="none" stroke="#f000ff" stroke-width="10" opacity=".3" filter="url(#glow)"/>
  <circle cx="100" cy="100" r="46" fill="none" stroke="#f000ff" stroke-width="8"/>
  <!-- glowing core -->
  <circle cx="100" cy="100" r="30" fill="url(#core)"/>
  <circle cx="100" cy="100" r="10" fill="#fdf3ff"/>
</svg>
