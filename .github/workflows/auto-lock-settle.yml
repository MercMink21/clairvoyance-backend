name: Auto Lock + Settle

# Server-side auto-lock (PREMIUM/OPTIMAL picks -- ML/spread/O-U for every
# sport/league with a real proprietary model, plus player props for NFL/
# NHL/NBA/WNBA) and auto-settle (checks every pending bet against real
# final scores/boxscores), replacing the dead file-based settlement path
# in clairvoyance_update.py's auto_settle() (depended on a file nothing
# ever actually wrote). See scripts/auto_lock_settle.py's module
# docstring for the full design.
#
# SAFETY: scheduled runs default to dry-run (no --live flag) -- they log
# exactly what WOULD be locked/settled and write nothing.
#
# GREEN-LIGHTING LIVE RUNS: once you've reviewed enough dry-run output,
# go to Settings -> Secrets and variables -> Actions -> Variables and add
# a repo variable named LIVE_MODE with value "true". Every scheduled run
# (lock and settle) will then pass --live automatically -- no workflow
# file edit needed. Set it back to "false" (or delete it) to return to
# dry-run at any time. workflow_dispatch always lets you choose live/dry
# per-run regardless of this variable.

on:
  schedule:
    # Main lock: 3 dedicated attempts, shifted earlier to 7:00/7:15/7:35am
    # MT -- per explicit request, multiple lock runs each morning, each
    # one independently verifying picks locked correctly (see
    # verify_todays_locks in auto_lock_settle.py). Locking itself is
    # idempotent (lockPick() dedupes), so all 3 running is safe; per
    # explicit request the subscriber email now waits until the LAST of
    # the 3 (7:35am MT) -- passed --final-lock-check below -- rather than
    # firing after just the first success, so it reflects everything all
    # 3 attempts together managed to lock. The first two are silent
    # unless something's actually wrong, in which case they're what
    # catches and fixes it before the email goes out, not after. 7:00 MT
    # = 13:00 UTC, clear of statmuse-daily.yml's 14:00 UTC cron (also
    # Playwright-heavy -- landing on the exact same minute risks the
    # runner queue-starvation pattern documented in social-cards-
    # daily.yml); the other two are spaced to avoid landing on each other
    # too. Like every other MT time in this file, these are fixed UTC
    # crons -- GitHub Actions doesn't shift for DST, so real landing
    # times drift ~1hr earlier MT once MST returns in November.
    - cron: '0 13 * * *'
    - cron: '15 13 * * *'
    - cron: '35 13 * * *'
    # Daily settlement digest: yesterday's results ONLY, once/day, after
    # the 3 lock checks above -- per explicit request (picks locked 7/28
    # get their results emailed the morning of 7/29, not mixed into a
    # same-day or multi-date dump). 8:15 MT = 14:15 UTC.
    - cron: '15 14 * * *'
    # Daily adaptive recalibration: 8:20 MT = 14:20 UTC, right after the
    # digest above so it reflects yesterday's now-fully-settled results.
    # Runs after TODAY's own 3 lock checks (7:00-7:35am MT) have already
    # happened, by design -- this commits the freshly-learned weights for
    # TOMORROW's lock to pick up, not a same-day effect. See
    # run_adaptive_recalibration/docs/adaptive_weights.json: the durable
    # fix for adaptiveTick() previously only ever writing to browser
    # localStorage, invisible to the automated headless lock pipeline.
    - cron: '20 14 * * *'
    # Settle: 7x daily -- 2 daytime (10am/3pm MT) plus 5 evening/
    # overnight (6:20pm/8:20pm/11:20pm/1:20am/4:20am MT) -- per explicit
    # request, extra evening/night coverage specifically so late-
    # finishing games (West Coast night games routinely end past
    # midnight MT) are as likely as possible to already be settled by
    # the time the NEXT morning's 8:15am digest runs, rather than
    # showing up as unresolved in that email. Offset :20 past the hour,
    # staggered off scheduled-refresh.yml's own cron times (0 15/21/5) to
    # avoid the same runner-contention pattern that caused the queue-
    # starvation failures fixed earlier this session. These keep bets
    # accurate throughout the day but never email -- see the 14:15 UTC
    # digest above for the one daily email. Only the 16:20 UTC (10:20am
    # MT) slot falls inside the lock catch-up window below (9am-12pm MT,
    # strictly bounded so a catch-up lock can never land in the afternoon
    # or evening per explicit request) -- the other settle-only slots
    # never attempt a lock catch-up, only a same-day failure alert if
    # lock still hasn't run by then.
    - cron: '20 16 * * *'
    - cron: '20 21 * * *'
    - cron: '20 0 * * *'
    - cron: '20 2 * * *'
    - cron: '20 5 * * *'
    - cron: '20 7 * * *'
    - cron: '20 10 * * *'
  workflow_dispatch:
    inputs:
      live:
        description: 'Actually write to Supabase (unchecked = dry-run, logs only)'
        required: false
        type: boolean
        default: false
      mode:
        description: 'Which step(s) to run'
        required: false
        type: choice
        options: ['both', 'lock', 'settle', 'daily-digest', 'adaptive-recalibration']
        default: 'both'

permissions:
  contents: write

jobs:
  auto-lock-settle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -q playwright requests
          playwright install --with-deps chromium

      - name: Determine step flags from trigger
        id: flags
        run: |
          # Scheduled runs now honor LIVE_MODE directly, same as
          # workflow_dispatch -- the dry-run gate that held scheduled runs
          # to dry-run through 2026-08-29 regardless of LIVE_MODE has been
          # removed (monitoring period judged sufficient; explicitly
          # requested to go live immediately rather than waiting for
          # 2026-08-30).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ inputs.mode }}" in
              lock)                    echo "step_flags=--lock" >> "$GITHUB_OUTPUT" ;;
              settle)                  echo "step_flags=--settle" >> "$GITHUB_OUTPUT" ;;
              daily-digest)            echo "step_flags=--daily-digest" >> "$GITHUB_OUTPUT" ;;
              adaptive-recalibration)  echo "step_flags=--adaptive-recalibration" >> "$GITHUB_OUTPUT" ;;
              *)                       echo "step_flags=" >> "$GITHUB_OUTPUT" ;;
            esac
            echo "live_flag=${{ inputs.live == true && '--live' || '' }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "15 14 * * *" ]; then
            echo "step_flags=--daily-digest" >> "$GITHUB_OUTPUT"
            echo "live_flag=${{ vars.LIVE_MODE == 'true' && '--live' || '' }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "20 14 * * *" ]; then
            echo "step_flags=--adaptive-recalibration" >> "$GITHUB_OUTPUT"
            echo "live_flag=${{ vars.LIVE_MODE == 'true' && '--live' || '' }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 13 * * *" ] || [ "${{ github.event.schedule }}" = "15 13 * * *" ]; then
            # First two of the 3 main lock checks -- lock + verify, no
            # email yet (see --final-lock-check on the 3rd below).
            echo "step_flags=--lock" >> "$GITHUB_OUTPUT"
            echo "live_flag=${{ vars.LIVE_MODE == 'true' && '--live' || '' }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "35 13 * * *" ]; then
            # 3rd and final main lock check -- this is the one that
            # actually emails subscribers, after the first two already
            # had their chance to lock anything qualifying.
            echo "step_flags=--lock --final-lock-check" >> "$GITHUB_OUTPUT"
            echo "live_flag=${{ vars.LIVE_MODE == 'true' && '--live' || '' }}" >> "$GITHUB_OUTPUT"
          else
            # Real bug, found and fixed: this used to be a flat "anything
            # that isn't exactly the 30 14 * * * schedule string is a
            # settle-only run" -- but GitHub Actions can (and does, under
            # load) silently DROP a scheduled trigger entirely rather than
            # just delay it. Confirmed live: 2026-08-28 had zero runs where
            # github.event.schedule matched "30 14 * * *" at all -- every
            # one of that day's 4 runs fell through to settle-only, so no
            # lock pass ever ran, and nothing here would have ever noticed
            # or recovered, no matter how many more scheduled runs fired
            # later that day. data/last_lock_date.txt (written below only
            # after a real --live lock pass) is checked here so ANY run
            # that does fire can catch a missed lock, instead of every
            # future trigger depending on that one exact cron string
            # firing again.
            #
            # Catch-up window strictly bounded to 9am-12pm MT -- per
            # explicit request, lock must only ever land in the morning,
            # never afternoon/evening. Past noon with no lock yet today,
            # this fires (deduped) a same-day failure alert instead of
            # attempting a late lock that would violate that.
            TODAY_MT=$(TZ=America/Denver date +%Y-%m-%d)
            HOUR_MT=$(TZ=America/Denver date +%H)
            LAST_LOCK_DATE=$(cat data/last_lock_date.txt 2>/dev/null || echo "")
            # Diagnostic: a real run on 2026-08-29 landed in the catchup
            # branch at what should have been ~9pm MT (well outside the
            # 9am-12pm bound below) -- added to self-diagnose on the next
            # occurrence rather than guessing further without more data.
            echo "::notice::step-flags debug: schedule='${{ github.event.schedule }}' TODAY_MT=$TODAY_MT HOUR_MT=$HOUR_MT LAST_LOCK_DATE=$LAST_LOCK_DATE"
            if [ "$LAST_LOCK_DATE" != "$TODAY_MT" ] && [ "$HOUR_MT" -ge 9 ] && [ "$HOUR_MT" -lt 12 ]; then
              # --final-lock-check here too -- this catch-up run is, by
              # definition, the last realistic chance to get subscribers
              # their picks that day (it only fires after all 3 scheduled
              # morning checks' windows have already passed). Without this
              # the main lock path would lock+verify but never email,
              # since it otherwise only emails on an explicit final check.
              # --settle kept alongside it, matching the original (pre-
              # this-change) catch-up behavior of also running settle.
              echo "step_flags=--lock --settle --final-lock-check" >> "$GITHUB_OUTPUT"
              echo "catchup=1" >> "$GITHUB_OUTPUT"
            else
              echo "step_flags=--settle" >> "$GITHUB_OUTPUT"
              if [ "$LAST_LOCK_DATE" != "$TODAY_MT" ] && [ "$HOUR_MT" -ge 12 ]; then
                LAST_ALERT_DATE=$(cat data/last_lock_alert_date.txt 2>/dev/null || echo "")
                if [ "$LAST_ALERT_DATE" != "$TODAY_MT" ]; then
                  echo "lock_missed_alert=1" >> "$GITHUB_OUTPUT"
                fi
              fi
            fi
            echo "live_flag=${{ vars.LIVE_MODE == 'true' && '--live' || '' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run auto-lock / auto-settle
        env:
          TZ: America/Denver
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Personal daily locked-picks breakdown -- separate secret from
          # SOCIAL_CARD_EMAIL_TO on purpose (this is a private betting
          # reference, not public social content). Falls back to
          # SOCIAL_CARD_EMAIL_TO in the script if unset, but add a
          # dedicated LOCKS_EMAIL_TO repo secret to send it somewhere else.
          LOCKS_EMAIL_TO: ${{ secrets.LOCKS_EMAIL_TO }}
          SOCIAL_CARD_EMAIL_TO: ${{ secrets.SOCIAL_CARD_EMAIL_TO }}
        run: |
          if [ -n "${{ steps.flags.outputs.catchup }}" ]; then
            echo "::notice::None of today's 3 dedicated 7:00-7:35am MT lock checks fired -- running a catch-up lock+settle pass (this one emails, since it's the last realistic chance today)."
          fi
          python3 scripts/auto_lock_settle.py ${{ steps.flags.outputs.step_flags }} ${{ steps.flags.outputs.live_flag }}

      - name: Record successful lock date
        # Only after a run that actually included a LIVE lock pass (the
        # dedicated 14:30 UTC slot, workflow_dispatch with lock/both, or
        # today's catch-up above) -- a dry-run, settle-only, or digest-only
        # run must never mark today as locked, or a later real catch-up
        # would wrongly skip itself.
        if: ${{ steps.flags.outputs.live_flag == '--live' && steps.flags.outputs.step_flags != '--settle' && steps.flags.outputs.step_flags != '--daily-digest' && steps.flags.outputs.step_flags != '--adaptive-recalibration' }}
        run: |
          TODAY_MT=$(TZ=America/Denver date +%Y-%m-%d)
          echo "$TODAY_MT" > data/last_lock_date.txt
          git add data/last_lock_date.txt
          if ! git diff --cached --quiet; then
            git -c user.name="clairvoyance-bot" -c user.email="bot@clairvoyance.local" commit -m "chore: record lock for $TODAY_MT"
            git -c user.name="clairvoyance-bot" -c user.email="bot@clairvoyance.local" pull --rebase origin main
            git push origin main
          fi

      - name: Send top picks digest
        # Explicit request: a separate, owner-only email (clairvoyanceengine@
        # gmail.com ONLY, never the subscriber lists) ranking the day's
        # already-locked picks by model win probability -- top 4 per league,
        # top 7 overall -- with parlay math. Fires right after the day's
        # final morning lock check, once everything qualifying for today is
        # already in Supabase (reads it fresh rather than re-gathering).
        # Same gating logic as "Record successful lock date" above, plus
        # requiring this really was the final check (not an earlier one of
        # the 3, which shouldn't email yet either).
        if: ${{ steps.flags.outputs.live_flag == '--live' && contains(steps.flags.outputs.step_flags, '--final-lock-check') }}
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 scripts/auto_lock_settle.py --top-picks-digest --live

      - name: Send lock-missed alert
        # Fires once per calendar day (deduped via data/last_lock_alert_date.txt)
        # the first time a settle-only run notices it's past noon MT with no
        # real lock yet today -- a same-day heads-up instead of relying on
        # someone noticing the header's LAST LOCK indicator on their own.
        if: ${{ steps.flags.outputs.lock_missed_alert == '1' }}
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          LOCKS_EMAIL_TO: ${{ secrets.LOCKS_EMAIL_TO }}
          SOCIAL_CARD_EMAIL_TO: ${{ secrets.SOCIAL_CARD_EMAIL_TO }}
        run: |
          python3 scripts/auto_lock_settle.py --alert-lock-missed
          TODAY_MT=$(TZ=America/Denver date +%Y-%m-%d)
          echo "$TODAY_MT" > data/last_lock_alert_date.txt
          git add data/last_lock_alert_date.txt
          if ! git diff --cached --quiet; then
            git -c user.name="clairvoyance-bot" -c user.email="bot@clairvoyance.local" commit -m "chore: record lock-missed alert for $TODAY_MT"
            git -c user.name="clairvoyance-bot" -c user.email="bot@clairvoyance.local" pull --rebase origin main
            git push origin main
          fi
