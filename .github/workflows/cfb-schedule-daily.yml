name: CFB Schedule + Lines Refresh

# Refreshes the full weekly schedule (all 16 weeks: Weeks 1-15 + Bowls)
# twice a day — lines move daily as books adjust and games occasionally
# get rescheduled (weather, TV), and the second run below exists
# specifically to pull in that day's final scores same-night rather than
# waiting until the next morning. The app's client-side Elo and
# team-specific home-field-advantage calc (docs/app.html's
# _cfbBuildElo/_cfbTeamHFA) are both computed from this file's
# homeScore/awayScore fields, not a live fetch, so a single once-a-day
# morning run meant a Saturday's games wouldn't feed Elo/HFA until
# Sunday morning at the earliest -- this closes most of that gap for the
# typical Saturday slate (most games finish by 11pm MT).

on:
  schedule:
    # 6:00 AM MT = 12:00 UTC (MDT) / 13:00 UTC (MST) — pre-slate line refresh
    - cron: '0 12 * * *'
    # 11:00 PM MT = 05:00 UTC (MDT) / 06:00 UTC (MST) — same-night final
    # scores for Elo/HFA, run close to (but after) scheduled-refresh.yml's
    # 05:00 UTC settlement pass so completed games are already settled by
    # the time this scrape captures their final scores.
    - cron: '10 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-cfb-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -q requests
      - name: Refresh schedule/lines and push
        env:
          TZ: America/Denver
        run: |
          git config user.name  "Clairvoyance Bot"
          git config user.email "bot@clairvoyance"
          python3 scripts/fetch_cfb.py --mode schedule --push
