name: Daily NHL Player Props Refresh

# Gives NHL player props/trends their own dedicated scheduled run — see
# nba-props-daily.yml's comment for the full reasoning (same gap, same fix,
# same --mode props fast-path).

on:
  schedule:
    # 10:30 MT = 16:30 UTC (MDT) / 17:30 UTC (MST)
    - cron: '30 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-nhl-props:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -q requests beautifulsoup4 lxml playwright
          playwright install chromium --with-deps

      - name: Refresh NHL props and push
        env:
          TZ: America/Denver
        run: |
          git config user.name  "Clairvoyance Bot"
          git config user.email "bot@clairvoyance"
          python3 scripts/clairvoyance_update.py --mode props --sport nhl --push
