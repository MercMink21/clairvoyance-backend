name: Soccer Schedule Refresh (Tomorrow)

# Evening-prior-lock support: scrapes TOMORROW's schedule/odds for the 5
# European leagues (Champions League, Premier League, La Liga, Bundesliga,
# Serie A -- MLS excluded, it kicks off at normal US evening times and
# never had the early-kickoff problem this exists for) into a SEPARATE
# file, docs/soccer_schedule_tomorrow.json, so the live site's own
# today-only docs/soccer_schedule.json (soccer-schedule-daily.yml) is
# never touched. Consumed by soccer-lock-evening.yml ~10 minutes later --
# same gap convention soccer-schedule-daily.yml already uses ahead of
# soccer-lock-early.yml (5 min there, proven sufficient in practice for
# GitHub Pages to redeploy the new file before the lock pass reads it).
#
# Why a separate scrape at all, rather than reusing today's file: odds
# for these 5 leagues are already posted 1-2+ days ahead of kickoff
# (confirmed live against the real ESPN API), so there's no data-
# availability reason to wait until the morning of -- this just points
# the same date-parameterized fetch_scoreboard() at tomorrow's date
# instead of today's. See scripts/scrape_soccer_schedule.py's --tomorrow
# flag and auto_lock_settle.py's run_soccer_evening_lock().

on:
  schedule:
    # 9:50 PM MT = 03:50 UTC (MDT) -- 10 min ahead of soccer-lock-
    # evening.yml's 10:00 PM MT lock pass. Like every other MT time in
    # this repo, this is a fixed UTC cron -- GitHub Actions doesn't shift
    # for DST, so the real landing time drifts ~1hr earlier MT once MST
    # returns in November.
    - cron: '50 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-soccer-schedule-tomorrow:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -q requests

      - name: Scrape and push
        env:
          TZ: America/Denver
        run: |
          git config user.name  "Clairvoyance Bot"
          git config user.email "bot@clairvoyance"
          python3 scripts/scrape_soccer_schedule.py --tomorrow --push
