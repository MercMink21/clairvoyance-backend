name: NFL Roster Refresh

# Conference/division membership essentially never changes mid-season
# (no realignment risk like CFB), so monthly is plenty -- same cadence
# reasoning as cfb-roster-monthly.yml.

on:
  schedule:
    - cron: '0 11 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-nfl-roster:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -q requests
      - name: Refresh roster and push
        env:
          TZ: America/Denver
        run: |
          git config user.name  "Clairvoyance Bot"
          git config user.email "bot@clairvoyance"
          python3 scripts/fetch_nfl.py --mode roster --push
