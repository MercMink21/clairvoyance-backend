name: NFL Schedule + Lines Refresh

# Daily refresh of the full 18-week schedule + postseason -- lines move
# daily as books adjust and games occasionally get rescheduled (weather,
# flex scheduling for Sunday/Monday night). Two runs: a morning line
# refresh, and a late-night run (matching CFB's same-night pattern) so
# Thursday/Sunday/Monday final scores reach the schedule file same-night
# for weather/settlement/Elo-style freshness rather than waiting until
# the next morning.

on:
  schedule:
    - cron: '0 12 * * *'
    - cron: '10 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-nfl-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -q requests
      - name: Refresh schedule/lines and push
        env:
          TZ: America/Denver
        run: |
          git config user.name  "Clairvoyance Bot"
          git config user.email "bot@clairvoyance"
          python3 scripts/fetch_nfl.py --mode schedule --push
