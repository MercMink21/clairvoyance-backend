name: Daily Pick-of-Day Social Posts

on:
  schedule:
    # ~12:23 MT. The 11:00-16:45 UTC window is packed with other daily
    # workflows (soccer/CFB locks, stats/props scrapers, social-cards-daily
    # itself) -- several of them Playwright-heavy, and social-cards-daily's
    # own history (2026-08-06) shows two such jobs landing ~22min apart can
    # queue-starve each other entirely (never assigned a runner). This job
    # is also Playwright + ffmpeg heavy, so it lands in the genuinely open
    # 17:00-21:00 UTC gap instead of adding to that cluster -- same-day
    # timely (real picks were already locked hours earlier, ~8:30am MT),
    # just not competing for runners with the morning rush.
    - cron: '23 18 * * *'
    # Real bug, found and fixed: a single daily cron trigger has no
    # recovery if GitHub silently drops it -- documented GitHub Actions
    # behavior under high load (this repo runs 25+ scheduled workflows),
    # confirmed live: 2026-08-28's 18:23 UTC trigger never fired at all
    # (last real run was the PRIOR evening's cycle). Two more staggered
    # fallback times, each a no-op if data/last_pick_of_day_date.txt
    # already shows today's date (see the new "Skip if already sent"
    # step below) -- so a dropped primary trigger gets caught same-day
    # instead of the email silently never going out.
    - cron: '23 21 * * *'
    - cron: '23 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip if already sent today
        id: gate
        run: |
          TODAY_MT=$(TZ=America/Denver date +%Y-%m-%d)
          LAST=$(cat data/last_pick_of_day_date.txt 2>/dev/null || echo "")
          if [ "$LAST" = "$TODAY_MT" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "already sent today ($TODAY_MT) -- this is a fallback slot, skipping"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: ${{ !steps.gate.outputs.skip }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: ${{ !steps.gate.outputs.skip }}
        run: |
          pip install -q playwright requests imageio-ffmpeg
          playwright install chromium --with-deps

      - name: Generate top-3-picks posts and email
        if: ${{ !steps.gate.outputs.skip }}
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SOCIAL_CARD_EMAIL_TO: ${{ secrets.SOCIAL_CARD_EMAIL_TO }}
        run: |
          python3 scripts/generate_pick_of_day_social.py

      - name: Record successful send
        if: ${{ !steps.gate.outputs.skip && success() }}
        run: |
          TODAY_MT=$(TZ=America/Denver date +%Y-%m-%d)
          echo "$TODAY_MT" > data/last_pick_of_day_date.txt
          git add data/last_pick_of_day_date.txt
          if ! git diff --cached --quiet; then
            git -c user.name="clairvoyance-bot" -c user.email="bot@clairvoyance.local" commit -m "chore: record pick-of-day send for $TODAY_MT"
            git -c user.name="clairvoyance-bot" -c user.email="bot@clairvoyance.local" pull --rebase origin main
            git push origin main
          fi

      # Same rationale as social-cards-daily.yml's own failure alert --
      # GitHub's scheduled-workflow queue can delay a run by 30-90+
      # minutes past the nominal cron time on its own; that's normal.
      # A genuinely failed run is not.
      - name: Alert on failure
        if: failure()
        run: echo "::error::Daily Pick-of-Day Social Posts run did not complete."
