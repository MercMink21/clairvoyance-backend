name: NFL Injuries + Transactions Refresh

# Injury statuses and transactions (trades/signings/releases) both
# change daily, unlike stats/standings which only move once a week's
# games are final -- so this runs once a day, separate from the
# Tuesday-only stats/standings job.

on:
  schedule:
    # 7:30 AM MT = 13:30 UTC (MDT) / 14:30 UTC (MST)
    - cron: '30 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-nfl-injuries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -q requests
      - name: Refresh injuries + transactions and push
        env:
          TZ: America/Denver
        run: |
          git config user.name  "Clairvoyance Bot"
          git config user.email "bot@clairvoyance"
          python3 scripts/fetch_nfl.py --mode injuries --push
          python3 scripts/fetch_nfl.py --mode transactions --push
