name: Daily Soccer Standings Refresh

# Snapshot of all 6 tracked leagues' standings (Champions League/Premier
# League/La Liga/Bundesliga/MLS/Serie A), written to docs/soccer_standings.
# json. Until this existed, standings only ever reached the model via a
# live browser fetch (_fetchLeagueStandings in docs/app.html) that fires
# when a user opens that specific league's matches tab -- a user who goes
# straight to picks/props got a silently-empty _leagueStandCache and
# _socStandingsFactor() quietly no-op'd. This gives every session a
# same-day snapshot to seed that cache with at boot; the frontend's own
# live fetch still overwrites it with fresher data the moment a user
# actually opens a matches tab.

on:
  schedule:
    # 7:00 AM MT = 13:00 UTC (MDT) / 14:00 UTC (MST) — standings move slowly
    # (only changes once a day's matches settle), so once daily is plenty;
    # timed between the two Opta refresh passes rather than on top of one.
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-soccer-standings:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -q requests

      - name: Scrape and push
        run: |
          git config user.name  "Clairvoyance Bot"
          git config user.email "bot@clairvoyance"
          python3 scripts/scrape_soccer_standings.py --push
