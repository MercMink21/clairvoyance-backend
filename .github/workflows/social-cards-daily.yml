name: Daily Social Cards Email

on:
  schedule:
    # Target 9:30 MT = 15:30 UTC (MDT) / 16:30 UTC (MST), but offset to :22
    # rather than the exact :30 mark — GitHub's scheduled-workflow queue is
    # heavily congested at round minutes (every repo on the platform cron'd
    # for :00/:15/:30/:45 piles in at once), which is why this run has
    # consistently landed 55-95 min late for the past 9+ days despite never
    # actually failing. An off-peak minute is a known, low-risk way to cut
    # that queueing delay — GitHub still doesn't guarantee exact timing on
    # shared runners, but this should land noticeably closer to 9:30 MT.
    - cron: '22 15 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Comma-separated periods to force past today''s date gate for review (weekly,monthly,yearly,alltime)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -q playwright requests imageio-ffmpeg
          playwright install chromium --with-deps

      - name: Generate cards and send email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SOCIAL_CARD_EMAIL_TO: ${{ secrets.SOCIAL_CARD_EMAIL_TO }}
        run: |
          python scripts/generate_social_cards.py --force "${{ github.event.inputs.force }}"

      # Pick of Day ledger (docs/pick_of_day.json — the home page's PICK OF
      # DAY tile fetches this directly) has to persist across runs so
      # yesterday's pick gets settled before today's is picked. GitHub
      # Actions runners are ephemeral, so the repo itself is the only
      # place that can hold this state. (Milestone emails retired —
      # data/social_milestones.json is no longer written.)
      - name: Commit pick-of-day state
        run: |
          git config user.name  "Clairvoyance Bot"
          git config user.email "bot@clairvoyance"
          git add docs/pick_of_day.json
          if git diff --cached --quiet; then
            echo "No state change"
          else
            git commit -m "social-cards: pick-of-day state update"
            git pull --rebase origin main
            git push
          fi

      # GitHub's scheduled-workflow queue routinely delays this run by
      # 30-90+ minutes past the nominal 9:30 MT cron time (observed
      # consistently — not a bug in this file, just how shared-runner
      # scheduling works), so a late email is normal. A genuinely failed
      # run is not — this is the one case worth an explicit page, same
      # alerting pattern scheduled-refresh.yml already uses.
      - name: Alert on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"content\":\"🔴 **Clairvoyance — Daily Social Cards Email FAILED**\\nScheduled 9:30 MT run did not complete. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" || true
          fi
